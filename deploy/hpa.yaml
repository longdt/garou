apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: garou-hpa
  namespace: garou
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: garou-server
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # prevent thrashing on traffic dips
    scaleUp:
      stabilizationWindowSeconds: 60   # react quickly to spikes
